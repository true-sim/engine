name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      # Pinned Mesa lavapipe and validation layer, offscreen SDL; tests must run validated.
      - uses: true-sim/build-logic/.github/actions/setup-vulkan@61314fb2c79472f89f95c8ffd001ee53e904b02a # main, 2026-10-27
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 27
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build publish -Pversion=${GITHUB_REF_NAME#v}
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
