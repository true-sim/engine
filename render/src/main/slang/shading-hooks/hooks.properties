# How [ShadingHook] structs become the shading's dispatch and Java (truesim.slang's ShadingHooks; README, "Writing a
# shading hook"), for every project that sees these templates: engine-render's own and any library's or game's, whose
# listing (slang.shadingHooks) also rebuilds its libraries' shading with every hook.

# The hook points a hook may have, a static function each (hooks.slang). A new point: its name here, its call below,
# and its function in dispatch.slang.template.
points=indirect,media
# Each point's call in a hook's case (`p` the shaded point; {params}: `params, ` for a hook with parameters).
call.indirect={struct}.indirect(p, {params}direction, light);
call.media={struct}.media(p, {params}ray);
params=params,\u0020
# A hook's case at a point: under its bit of its SHADING_HOOKS_<n> (a specialization constant: compiled out where
# clear), its parameters ({load}: loaded field by field from load.address, pitfalls.md: no loads of whole structs
# through pointers) handed to it typed.
case=\    if (({word} & {bit}) != 0) // {name}\n\
\    {\n\
{load}\
\        {call}\n\
\    }\n
# Where hook {index}'s parameters are: the view's table's address of them (indirect.slang).
load.address=hookParameters(t, {index})
# Each hook's index constant: HOOK_ and its name in capitals (probeVolume: HOOK_PROBE_VOLUME).
constant=HOOK_{NAME}
# The specialization constants of the hooks' bits, 32 a constant, their ids from 3 on (0 to 2: a shader's own).
constant.first=3
constant.name=SHADING_HOOKS_{word}
constant.declaration=[vk::constant_id({id})]\npublic const uint {name} = 0;\n
# The material-type entry points that shade (material-types/entry<Suffix>.slang.template): rebuilt with every hook.
typeEntries=,Forward,ForwardLean,Hit
