# How [ShadingHook] structs become the shading's dispatch and Java (truesim.slang's ShadingHooks; README, "Writing a
# shading hook"), for every project that sees these templates: engine-render's own and any library's or game's, whose
# listing (slang.shadingHooks) also rebuilds its libraries' shading with every hook.

# The hook points a hook may have, a static function each (hooks.slang).
points=indirect,media
# Each point's call in a hook's case (`p` the shaded point, its data loaded; the rest the point's arguments).
call.indirect={struct}.indirect(p, direction, light);
call.media={struct}.media(p, ray);
# A hook's case at a point: under its bit of SHADING_HOOKS (a specialization constant: compiled out where clear), its
# slot of the view's table read a field at a time (pitfalls.md: no loads of whole structs through pointers).
case=\    if ((SHADING_HOOKS & {bit}) != 0) // {name}\n\
\    {\n\
\        p.data.address = t[0].hooks[{index}].address;\n\
\        p.data.words = t[0].hooks[{index}].words;\n\
\        p.data.values = t[0].hooks[{index}].values;\n\
\        p.data.more = t[0].hooks[{index}].more;\n\
\        {call}\n\
\    }\n
# Each hook's index constant: HOOK_ and its name in capitals (probeVolume: HOOK_PROBE_VOLUME).
constant=HOOK_{NAME}
# The most hooks: the slots of the view's table (indirect.slang's SHADING_HOOK_SLOTS).
hooks.max=8
# The material-type entry points that shade (material-types/entry<Suffix>.slang.template): rebuilt with every hook.
typeEntries=,Forward,ForwardLean,Hit
