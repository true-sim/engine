# How a [MaterialType] struct becomes Java and entry points (truesim.slang's GenerateSlangRecords): the class of its
# generated TYPE constant and the expression making it, for every project whose shaders declare material types.
class=com.truesim.engine.render.MaterialType
factory=new MaterialType("{name}", {parameters}.class, {parameters}::fromValues, {features}, \
    "shaders/material-types/{name}.spv", "{name}Main", "shaders/material-types/{name}Traced.spv", "{name}TracedMain")
