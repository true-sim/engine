name: Repro

# TEMPORARY (removed before merge): the lavapipe crash in ray-traced tests, reproduced fast. Each job runs one class
# again and again with normal lavapipe settings and keeps the JVM crash logs.
on:
  push:
    branches: [split-1]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  GITHUB_ACTOR: ${{ github.actor }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  repro:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: path-tracer
            tests: ":engine-render:test --tests *ReferencePathTracerTest"
          - name: shadow-owner
            tests: ":engine-render:test --tests *ShadowOwnerTest"
          - name: probe-volume
            tests: ":engine-render:test --tests *ProbeVolumeTest"
          - name: gi-scenes
            tests: ":engine-scene:test --tests *GiScenesTest"
    name: repro (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v7
      - uses: true-sim/build-logic/.github/actions/setup-vulkan@61314fb2c79472f89f95c8ffd001ee53e904b02a # main, 2026-10-27
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 27
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew ${{ matrix.tests }} -x jacocoTestReport --dry-run >/dev/null
      - name: The class again and again
        run: |
          crashes=0
          for i in 1 2 3 4 5 6 7 8; do
            if ! ./gradlew ${{ matrix.tests }} --rerun -q > run-$i.log 2>&1; then
              echo "iteration $i failed"; grep -E "SIGSEGV|FAILED|Problematic" -A2 run-$i.log | head -12
              crashes=$((crashes + 1))
              mkdir -p crashes/$i; cp run-$i.log crashes/$i/; cp */hs_err_pid*.log crashes/$i/ 2>/dev/null; rm -f */hs_err_pid*.log
              cp -r */build/test-results crashes/$i/ 2>/dev/null || true
            else
              echo "iteration $i passed"
            fi
          done
          echo "crashes: $crashes of 8"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: repro-${{ matrix.name }}
          path: crashes
          if-no-files-found: ignore
