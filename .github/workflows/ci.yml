name: CI

on:
  push:
    branches: [main, ci-measure]
  pull_request:

permissions:
  contents: read
  packages: read # build-logic plugins and libraries from GitHub Packages

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Only Markdown changed (docs): the required check passes without building. Any doubt builds.
      - id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if files=$(git diff --name-only "$BASE" HEAD 2>/dev/null) && [ -n "$files" ] && ! echo "$files" | grep -qv '\.md$'; then
            echo "Only Markdown changed, build skipped:"; echo "$files"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi
      # Pinned Mesa lavapipe and validation layer, offscreen SDL; tests must run validated.
      - uses: true-sim/build-logic/.github/actions/setup-vulkan@61314fb2c79472f89f95c8ffd001ee53e904b02a # main, 2026-10-27
        id: vulkan
        if: steps.changes.outputs.code == 'true'
      # Mesa's shader cache: lavapipe compiles shader variants as frames first draw with them, and a cold cache cost the
      # particle tests minutes (docs/pitfalls.md). Content-addressed by Mesa, so a stale entry is never used, only
      # unused; the key names the driver and the shaders, and each run saves what it added for the next.
      - if: steps.changes.outputs.code == 'true'
        run: echo "MESA_SHADER_CACHE_DIR=$RUNNER_TEMP/mesa-shader-cache" >> "$GITHUB_ENV"
      - uses: actions/cache@v6
        if: steps.changes.outputs.code == 'true'
        with:
          path: ${{ runner.temp }}/mesa-shader-cache
          key: mesa-shaders-${{ steps.vulkan.outputs.driver }}-${{ hashFiles('*/src/*/slang/**') }}-${{ github.run_id }}
          restore-keys: |
            mesa-shaders-${{ steps.vulkan.outputs.driver }}-${{ hashFiles('*/src/*/slang/**') }}-
            mesa-shaders-${{ steps.vulkan.outputs.driver }}-
      - uses: actions/setup-java@v6
        if: steps.changes.outputs.code == 'true'
        with:
          distribution: temurin
          java-version: 27
      - uses: gradle/actions/setup-gradle@v6
        if: steps.changes.outputs.code == 'true'
      - run: ./gradlew build
        if: steps.changes.outputs.code == 'true'
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v7
        if: always() && steps.changes.outputs.code == 'true'
        with:
          name: reports
          path: |
            */build/reports
            */build/test-results
