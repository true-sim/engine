name: Repro

# TEMPORARY (removed before merge): the lavapipe crash in ray-traced tests, reproduced fast. Each job runs GiScenesTest
# again and again under CPU load (as the other test JVMs of a shard put on it) and keeps the JVM crash logs.
on:
  push:
    branches: [split-1]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  GITHUB_ACTOR: ${{ github.actor }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  repro:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        level: [degenerate, tiny, absent]
        copy: [1, 2, 3]
    name: repro (${{ matrix.level }}, ${{ matrix.copy }})
    env:
      TRUESIM_EMPTY_LEVEL: ${{ matrix.level }}
    steps:
      - uses: actions/checkout@v7
      - uses: true-sim/build-logic/.github/actions/setup-vulkan@61314fb2c79472f89f95c8ffd001ee53e904b02a # main, 2026-10-27
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 27
      - uses: gradle/actions/setup-gradle@v6
      - name: GiScenesTest again and again, under load
        run: |
          mkdir -p crashes
          ./gradlew :engine-scene:testClasses -q
          for c in 1 2 3; do (while true; do :; done) & done
          crashes=0
          for i in 1 2 3 4 5 6; do
            if ! ./gradlew :engine-scene:test --tests '*.GiScenesTest' --rerun -q > run-$i.log 2>&1; then
              echo "iteration $i failed"; grep -E "SIGSEGV|FAILED|Problematic" -A2 run-$i.log | head -12
              crashes=$((crashes + 1))
              mkdir -p crashes/$i; cp run-$i.log crashes/$i/; cp */hs_err_pid*.log crashes/$i/ 2>/dev/null; rm -f */hs_err_pid*.log
            else
              echo "iteration $i passed"
            fi
          done
          echo "crashes: $crashes of 6"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: repro-${{ matrix.level }}-${{ matrix.copy }}
          path: crashes
          if-no-files-found: ignore
