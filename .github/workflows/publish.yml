name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      SDL_VIDEO_DRIVER: offscreen
    steps:
      - uses: actions/checkout@v7
      - name: Install Vulkan (lavapipe and validation layers)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libvulkan1 mesa-vulkan-drivers vulkan-validationlayers
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 27
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build publish -Pversion=${GITHUB_REF_NAME#v}
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
