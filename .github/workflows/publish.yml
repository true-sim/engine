name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      # Pinned Mesa lavapipe and validation layer, offscreen SDL; tests must run validated.
      - uses: true-sim/build-logic/.github/actions/setup-vulkan@47c6756c3483a67959a40f9f9a99410faa89dc28 # mesa-26.2: Mesa 26.2.6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 27
      - uses: gradle/actions/setup-gradle@v6
      # one module at a time: parallel uploads of a new version can race to create it on GitHub Packages (409 Conflict)
      - run: ./gradlew publish --no-parallel -Dorg.gradle.internal.http.socketTimeout=600000 -Dorg.gradle.internal.http.connectionTimeout=600000 -Pversion=${GITHUB_REF_NAME#v}
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
