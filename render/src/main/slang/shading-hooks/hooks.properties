# How [ShadingHook] structs become the shading's dispatch and Java (truesim.slang's ShadingHooks; README, "Writing a
# shading hook"), for every project that sees these templates: engine-render's own and any library's or game's, whose
# listing also rebuilds its libraries' shading with every hook.

# The hook points, each a function of the dispatch (dispatch.slang.template) and an interface a hook conforms to
# (hooks.slang). A new point: its name here, its interface and call below, its function in the dispatch.
points=surface,indirect,media,geometry
interface.surface=ISurfaceHook
interface.indirect=IIndirectHook
interface.media=IMediaHook
# The geometry point has no function: its hooks carry records geometry reads (material types' displace()).
interface.geometry=IGeometryHook
# Each point's call in a hook's case: `p` the shaded point, {params} the hook's parameters.
call.surface={struct}.surface(p, {params}, s);
call.indirect={struct}.indirect(p, {params}, q, light);
call.media={struct}.media(p, {params}, ray);
call.geometry=
# A hook's parameters: a pointer to its record in the view's hook block, never null: the override entry's (`entry`,
# the shaded instance's) where it has one for the hook, else the view's.
params=({parameters}*) (hookRecord(block, {index}, SHADING_HOOK_COUNT, entry))
# A hook's case at a point: under its specialization constant (compiled out where a pipeline is made without it), its
# bit of the view's block (on or off from frame to frame), the override entry's switch and the material's refusal.
case=\    if ({switch} && hookRuns(block, {index}, SHADING_HOOK_COUNT, entry, refused)) // {name}\n\
\    {\n\
\        {call}\n\
\    }\n
# Each hook's index constant: HOOK_ and its name in capitals (probeVolume: HOOK_PROBE_VOLUME).
constant=HOOK_{NAME}
# Each hook's specialization constant: a bool, id 1024 + its index (above any shader's own; vulkan's Specialization
# requires every pipeline to set those its shader declares).
# Its index is exported for link time too (RUN_HOOK_<NAME>_INDEX): a module the build reads before it writes this
# dispatch (a material type's, whose displace() reads a hook's record) declares it `extern static const uint
# RUN_HOOK_<NAME>_INDEX;` instead of importing the dispatch.
switch.name=RUN_HOOK_{NAME}
switch.first=1024
switch.declaration=[vk::constant_id({id})]\npublic const bool {name} = false;\nexport static const uint {name}_INDEX = {id} - 1024;\n
# The material-type entry points that shade (material-types/entry<Suffix>.slang.template): rebuilt with every hook.
# Displace*: a displacing type's vertex and mesh stages, motion vectors and compute pass read hook records by index.
typeEntries=,Forward,ForwardLean,Hit,Displace,DisplaceMotion,DisplaceCompute
# The listing is a service: engine-render's ShadingHooks finds the listings on the classpath.
service=com.truesim.engine.render.ShadingHookListing
