# How [ParticleModule] structs become the interpreting kernel's dispatch and Java (truesim.slang's GenerateSlangRecords,
# effects.md E24), for every project whose shaders declare particle modules: engine-render's own (the built-in ones)
# and a game's, whose kernel variants then hold the built-in modules and its own.

# The stages a module may have, in the order a step runs them: a module has each it defines a function of. Bit i of
# a module's stages (written into its op word) is stage i: STAGE_* of dispatch.slang.template.
stages=init,force,after,collide,update,over
# When each runs: scene-effects' ModuleType.Stage. A module's stages all run at one of them.
stage.init=INIT
stage.force=UPDATE
stage.after=UPDATE
stage.collide=UPDATE
stage.update=UPDATE
stage.over=UPDATE
# Each stage's call of a module's function, in its case of the stage's dispatch (`it` the module, its fields read).
call.init=it.init(s, p);
call.force=it.force(s, p);
call.after=it.after(s, p);
call.collide=hit = it.collide(s, p);
call.update=it.update(s, p);
call.over=it.over(s, p);

# The most fields a module has: 16 salts each, its fields' first, its own draws from 8 on.
fields.max=8
# The most opcodes: an op word's low byte.
opcodes.max=255
# Each module's opcode constant: OP_ and its name in capitals (force.speedLimit: OP_FORCE_SPEED_LIMIT).
opcode=OP_{NAME}

# Field kinds by Slang type (particles/particle.slang): words in the op, how the dispatch reads one (at word `op + 2
# + {word}`, the {index}th field), its Java fallback ({value}: its initializer's numbers, else `default`).
field.float.words=4
field.float.read=value(m, keys, op + 2 + {word}, salt + {index}, p)
field.float.java=Bind.constant({value})
field.float.default=0
field.ModuleColor.words=5
field.ModuleColor.read=colorOf(m, keys, op + 2 + {word}, salt, p)
field.ModuleColor.java=Bind.color({value})
field.ModuleColor.default=1, 1, 1, 1
field.ModuleCurve.words=1
field.ModuleCurve.read=curve(keys, m.program[op + 2 + {word}], p.age / p.lifetime)
field.ModuleCurve.java=FloatCurve.constant({value})
field.ModuleCurve.default=1
field.ModuleGradient.words=1
field.ModuleGradient.read=gradient(keys, m.program[op + 2 + {word}], p.age / p.lifetime)
field.ModuleGradient.java=ColorGradient.constant({value})
field.ModuleGradient.default=1, 1, 1, 1
field.ModuleTexture.words=4
field.ModuleTexture.read=m.program[op + 2 + {word}]
field.ModuleTexture.java=Forces.NO_FIELD

# The define a capability's modules (and their imports) are compiled under: only its kernel variants have them.
capability.RAY_QUERY=PARTICLE_RAYS

# A module's scene-effects ModuleType (Modules.java.template imports the classes named): its targets (GPU only, both
# with a built-in twin, or its own twin's), its capability and its fields.
java.type=ModuleType.builder("{name}", ModuleType.Stage.{stage})\
{targets}{capability}{fields}.build()
java.gpu=.targets(Target.GPU)
java.cpu=
java.twin=.twin(new {twin}())
java.capability=.capability(Capability.{capability})
java.field=.field("{field}", {fallback})
