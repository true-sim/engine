name: Repro

# TEMPORARY (removed before merge): the lavapipe crash in ray-traced tests, reproduced fast. Each job runs one class
# again and again with normal lavapipe settings and keeps the JVM crash logs.
on:
  push:
    branches: [split-1]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  GITHUB_ACTOR: ${{ github.actor }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  repro:
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        level: [degenerate, nan, tiny]
        shard: [5, 8, 9]
    name: repro (${{ matrix.level }}, shard ${{ matrix.shard }})
    env:
      TRUESIM_EMPTY_LEVEL: ${{ matrix.level }}
    steps:
      - uses: actions/checkout@v7
      - uses: true-sim/build-logic/.github/actions/setup-vulkan@61314fb2c79472f89f95c8ffd001ee53e904b02a # main, 2026-10-27
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 27
      - uses: gradle/actions/setup-gradle@v6
      - name: The class again and again
        run: |
          mkdir -p crashes
          (while true; do echo "$(date +%T) $(free -m | awk '/Mem:/ {print "used " $3 " free " $4 " available " $7}')"; sleep 5; done) > crashes/memory.log &
          crashes=0
          for i in 1 2; do
            if ! ./gradlew :engine-render:test :engine-scene:test :engine-ui:test -Ptruesim.shard=${{ matrix.shard }}/10 -Ptruesim.shardModules=engine-render,engine-scene,engine-ui --rerun -q > run-$i.log 2>&1; then
              echo "iteration $i failed"; grep -E "SIGSEGV|FAILED|Problematic" -A2 run-$i.log | head -12
              crashes=$((crashes + 1))
              mkdir -p crashes/$i; cp run-$i.log crashes/$i/; cp */hs_err_pid*.log crashes/$i/ 2>/dev/null; rm -f */hs_err_pid*.log
              cp -r */build/test-results crashes/$i/ 2>/dev/null || true
            else
              echo "iteration $i passed"
            fi
          done
          echo "crashes: $crashes of 2"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: repro-${{ matrix.level }}-${{ matrix.shard }}
          path: crashes
          if-no-files-found: ignore
