name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read # build-logic plugins and libraries from GitHub Packages

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      # Pinned Mesa lavapipe and validation layer, offscreen SDL; tests must run validated.
      - uses: true-sim/build-logic/.github/actions/setup-vulkan@0eef1f386b2407335e042caf7a5e8ebe892177c3 # main, 2026-10-27
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 27
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew build
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: reports
          path: |
            */build/reports
            */build/test-results
