name: CI

# Tests run on pull requests only: main gets exactly a tested, up-to-date PR (release.sh merges only those), so a
# push to main only compiles, to keep the Gradle cache that pull requests read warm.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read # build-logic plugins and libraries from GitHub Packages

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Only Markdown changed (docs): the required check passes without building. Any doubt builds.
      - id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if files=$(git diff --name-only "$BASE" HEAD 2>/dev/null) && [ -n "$files" ] && ! echo "$files" | grep -qv '\.md$'; then
            echo "Only Markdown changed, build skipped:"; echo "$files"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi
      # Pinned Mesa lavapipe and validation layer, offscreen SDL; tests must run validated.
      - uses: true-sim/build-logic/.github/actions/setup-vulkan@61314fb2c79472f89f95c8ffd001ee53e904b02a # main, 2026-10-27
        if: steps.changes.outputs.code == 'true'
      - uses: actions/setup-java@v6
        if: steps.changes.outputs.code == 'true'
        with:
          distribution: temurin
          java-version: 27
      - uses: gradle/actions/setup-gradle@v6
        if: steps.changes.outputs.code == 'true'
      - run: ./gradlew ${{ github.event_name == 'push' && 'assemble testClasses' || 'build' }}
        if: steps.changes.outputs.code == 'true'
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v7
        if: always() && steps.changes.outputs.code == 'true'
        with:
          name: reports
          path: |
            */build/reports
            */build/test-results
